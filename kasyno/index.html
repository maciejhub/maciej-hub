<style>
.shop-thing {
    scrollbar-width: auto;
    scrollbar-gutter: stable both-edges;
    overflow-x: scroll;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: 0.25rem;
    padding-right: 0.5rem;
}

/* this stuff is so the scrollbar doesnt disappear */
.shop-thing::-webkit-scrollbar {
  height: 1.1rem;
  display: block;
  margin-top: 5px;
}

.shop-thing::-webkit-scrollbar-track {
  background: #292929;
  border-radius: 0.5rem;
}

.shop-thing::-webkit-scrollbar-thumb {
  background: #191919;
  border-radius: 0.5rem;
  border: 3px solid #292929;
}

.shop-thing::-webkit-scrollbar-thumb:hover {
  background: #151515;
}

.whitecontainer {
    background-color: transparent;
    display: inline-block;
    position: relative;
}

.whitecontainer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 0.5rem solid white;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 2;
}

.whitecontainer img {
    position: relative;
}

.casinoitems {
    background-color: #292929;
    padding: 5px;
    font-size: 1.5rem;
    color: #ffffff;
    border: 7px solid #191919;
    bottom: 20px;
    cursor: pointer;
    width: 110%;
    height: 40vh;
    max-height: 12rem;
    line-height: 150%;
    margin-right: 0.25rem;
}

@media (orientation: portrait) {
    .questbutton {
        background-color: #292929;
        color: #ffffff;
        border: 7px solid #191919;
        cursor: pointer;
        width: 90%;
        text-align: start;
        font-size: 1.2rem;
        padding: 0.5rem;
    }
}

@media (orientation: landscape) {
    .questbutton {
        background-color: #292929;
        color: #ffffff;
        border: 7px solid #191919;
        cursor: pointer;
        width: 60%;
        text-align: start;
        font-size: 1.2rem;
        padding: 0.5rem;
    }
}


</style>
