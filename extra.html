<script>

function sleep(ms) { // stolen
    return new Promise(resolve => setTimeout(resolve, ms));
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}

async function animation() {
  await sleep(500);
  document.getElementById("plus").innerHTML = " +" + difference;
  await sleep(1000);
  document.getElementById("sessioncounter").innerHTML = "To jest twój " + sessionsitem + " raz na maciej hub!";
  await sleep(800);
  document.getElementById("plus").innerHTML = "";
}

const sessionsitem = localStorage.getItem("sessions")
const prevsessionsitem = localStorage.getItem("previousSessions")
let difference = parseInt(sessionsitem) - parseInt(prevsessionsitem)
if (difference > 0) {
document.getElementById("sessioncounter").innerHTML = "To jest twój " + prevsessionsitem + " raz na maciej hub!";
} else {
  document.getElementById("sessioncounter").innerHTML = "To jest twój " + sessionsitem + " raz na maciej hub!";
}
localStorage.setItem("previousSessions", sessionsitem);
if (difference > 0) {
  animation();
}

function showunrelated() {
  document.getElementById("unrelated").style.display = "initial";
  document.getElementById("showtext").style.display = "none";
}

function hidemessages() {
  document.getElementById("messagepopup").style.height = "30%";
  document.getElementById("messages").innerHTML = "";
  document.getElementById("messagepopup").style.display = "none";
}

window.addEventListener("message", (event) => {
  if (event.data == "OK") {
    hidemessages();
  }
});

function showqrs() {
  createnewpopup("extrapopup", "<iframe src='/iframes/qrthing' scrolling='yes' frameborder='0'></iframe>", "");
  get("extrapopup").querySelector("iframe").style.width = `${get("extrapopup").clientWidth}px`;
  get("extrapopup").querySelector("iframe").style.height = `20rem`;
}

function showversions() {
  createnewpopup("extrapopup", "<iframe src='/iframes/versionthing' scrolling='yes' frameborder='0'></iframe>", "");
  get("extrapopup").querySelector("iframe").style.width = `${get("extrapopup").clientWidth}px`;
}

function showmessages() {
  createnewpopup("extrapopup", "<iframe src='/iframes/globalmessage' scrolling='yes' frameborder='0'></iframe>", "");
  get("extrapopup").querySelector("iframe").style.width = `${get("extrapopup").clientWidth}px`;
}

let install_prompt = undefined;
let pwa_prompt_supported = false;

window.addEventListener("beforeinstallprompt", (event) => {
  console.log("install promot")
  get("app").hidden = true;
  install_prompt = event;
  pwa_prompt_supported = true;
});

get("app").addEventListener("click", function () {
  let popupnumber = undefined;
  if (is_pwa) {
    popupnumber = createnewpopup("extrapopup", "<iframe src='/iframes/app_settings.html' scrolling='yes' frameborder='0'></iframe>", "");
    get("extrapopup").querySelector("iframe").style.width = `${get("extrapopup").clientWidth * 0.9}px`;
  } else {
    if (pwa_prompt_supported) {
      install_prompt.prompt();
    } else {
      popupnumber = createnewpopup("extrapopup", "<iframe src='/iframes/app_settings.html' scrolling='yes' frameborder='0'></iframe>", "");
      get("extrapopup").querySelector("iframe").style.width = `${get("extrapopup").clientWidth * 0.9}px`;
    }
  }
  get(`closepopupbutton${popupnumber}`).style.marginBottom = "2rem";
  //get(`closepopupbutton${popupnumber}`).style.marginTop = "-2rem";

  let frame = get("extrapopup").querySelector("iframe")
  frame.addEventListener("load", function () {
    console.log(`${frame.contentWindow.document.body.scrollHeight} vs ${frame.clientHeight}`);
    let height = frame.contentWindow.document.body.scrollHeight + 100;
    if (height > window.innerHeight * 0.7) {
      height = window.innerHeight * 0.7;
    }
      get(`closepopupbutton${popupnumber}`).style.marginBottom = "3rem";
      get(`closepopupbutton${popupnumber}`).style.marginTop = "-2rem";
    frame.style.height = `${height - 82}px`;
    get("extrapopup").style.height = `${height}px`;
    frame.style.width = `${get("extrapopup").clientWidth}px`;
  });

});

if (is_pwa) {
  get("app").innerText = "Zmień ustawienia aplikacji";
}
</script>
